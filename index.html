<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CitizenPulse • Real Citizen Sentiment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    .neon-cyan { text-shadow: 0 0 15px #22d3ee; }
    .live-dot { animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .topic-card { transition: all 0.4s ease; }
    .topic-card:hover { transform: translateY(-8px); border-color: #67e8f9; }
  </style>
</head>
<body class="bg-[#0a0f1c] text-gray-200">

  <div class="flex h-screen">
    <!-- Sidebar Navigation -->
    <div class="w-72 bg-[#111827] border-r border-gray-800 flex flex-col">
      <div class="p-6 border-b border-gray-800">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-cyan-500 rounded-2xl flex items-center justify-center text-white font-bold text-3xl">C</div>
          <h1 class="text-3xl font-bold tracking-tighter neon-cyan">CitizenPulse</h1>
        </div>
      </div>

      <nav class="flex-1 p-4 space-y-1">
        <a href="index.html" class="flex items-center gap-3 px-5 py-4 rounded-2xl bg-gray-800 text-white">
          <i class="fas fa-tachometer-alt"></i> Overview
        </a>
        <a href="live-topic.html" class="flex items-center gap-3 px-5 py-4 rounded-2xl hover:bg-gray-800">
          <i class="fas fa-chart-line"></i> Live Intelligence
        </a>
        <a href="compare.html" class="flex items-center gap-3 px-5 py-4 rounded-2xl hover:bg-gray-800">
          <i class="fas fa-balance-scale"></i> Compare
        </a>
        <a href="about.html" class="flex items-center gap-3 px-5 py-4 rounded-2xl hover:bg-gray-800">
          <i class="fas fa-info-circle"></i> About
        </a>
      </nav>

      <div class="p-6 border-t border-gray-800">
        <div class="bg-gray-900 rounded-3xl p-5 space-y-4">
          <div><p class="text-xs text-gray-400">Posts Analyzed</p><p class="text-3xl font-semibold">4.87M</p></div>
          <div class="grid grid-cols-2 gap-4">
            <div><p class="text-xs text-gray-400">Grok AI Accuracy</p><p class="text-3xl font-semibold text-cyan-400">94.2%</p></div>
            <div><p class="text-xs text-gray-400">Countries</p><p class="text-3xl font-semibold">18+</p></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 overflow-auto p-10">
      <h1 class="text-5xl font-bold">What Citizens <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">Actually Think</span></h1>
      
      <h3 class="text-xl font-semibold mt-12 mb-8">Active Topics</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="topic-grid"></div>
    </div>
  </div>

  <script>
    const topics = [
      { emoji: "🇱🇧🇮🇱", title: "Israel-Lebanon Direct Talks", summary: "War fatigue vs security demands", link: "live-topic.html" },
      { emoji: "🕊️", title: "Abraham Accords Expansion", summary: "Economic normalization push", link: "live-topic.html" },
      { emoji: "🇮🇷", title: "Iran Regime & Proxies", summary: "Public rejection of regime", link: "live-topic.html" }
    ];

    function renderTopics() {
      const container = document.getElementById('topic-grid');
      container.innerHTML = topics.map(t => `
        <div onclick="window.location.href='${t.link}'" class="topic-card bg-[#161b22] border border-gray-700 hover:border-cyan-400 rounded-3xl p-8 cursor-pointer">
          <div class="flex justify-between mb-6">
            <span class="text-6xl">${t.emoji}</span>
            <span class="px-4 py-1 text-xs bg-emerald-500/10 text-emerald-400 rounded-2xl">LIVE</span>
          </div>
          <h3 class="text-2xl font-semibold">${t.title}</h3>
          <p class="text-gray-400 mt-3">${t.summary}</p>
        </div>
      `).join('');
    }

    renderTopics();
  </script>
</body>
</html>
